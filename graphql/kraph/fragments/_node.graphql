# `Node` is one graph's drawing of a claim, and it is exactly the three values of
# `InstanceKind`: Entity, NaturalEvent, ProtocolEvent.
#
# `Structure` and `Metric` used to implement it. They no longer do, and should
# not have: they are rows of different tables, not instances — a structure points
# at an external datum and a metric is a measured value about one. Neither is ever
# drawn as a vertex. Read them at claim grain (`structure(id:)`, `metric(id:)`).
#
# There is no `graph` field here either. A claim is organization-grain and may be
# drawn by several views at once, so "the graph this node is in" was never a
# single answer — `Instance.drawnIn` is, and it returns all of them.

fragment BaseNode on Node {
  id
  label
}

fragment ListNode on Node {
  id
  label
}

fragment Node on Node {
  ...BaseNode
  ...Entity
  ...NaturalEvent
  ...ProtocolEvent
}

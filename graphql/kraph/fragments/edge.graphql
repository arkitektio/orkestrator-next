# `Edge` is one graph's drawing of a `Link`. The `Path*` family that used to live
# here went with the path renderer: `GraphPathRender` was removed from the schema,
# so nothing fetched them and no operation spread them.

fragment BaseEdge on Edge {
  id
  label
  sourceId
  targetId
}

fragment Measurement on Measurement {
  ...BaseEdge
  category {
    id
    label
  }
}

fragment Relation on Relation {
  ...BaseEdge
  category {
    id
    label
  }
}

fragment StructureRelation on StructureRelation {
  ...BaseEdge
  # Both ends are structures, which carry no label — `(identifier, object)` is
  # how a structure is named.
  source {
    id
    identifier
    object
  }
  target {
    id
    identifier
    object
  }
  category {
    id
    label
  }
}

fragment Edge on Edge {
  ...BaseEdge
  ...Measurement
  ...Relation
  ...StructureRelation
}

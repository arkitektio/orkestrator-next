# An entity as one view draws it: the category it was drawn under, and the
# properties that view derives. All of that is view-grain and exists only inside
# a graph — the claim underneath is `Instance`.
#
# `measuredBy`, `participatedIn` and `resultedOut` were three separate traversals
# for three link kinds. There is one now: `connections`, every `Link` touching
# this node, discriminated by `kind`. That is more honest than three fields,
# because a link's kind is what distinguishes it and there are eight of them.

fragment ListEntity on Entity {
  id
  label
  category {
    id
    label
  }
}

fragment Entity on Entity {
  ...BaseNode
  category {
    id
    label
    ageName
    propertyDefinitions {
      ...PropertyDefinition
    }
  }
  richProperties {
    key
    value
  }
  properties
  connections {
    ...Edge
  }
  # Which views draw this claim. Replaces the old single `graph`, which could
  # only ever name one of them.
  drawnIn {
    graph {
      id
      name
    }
    category {
      id
      label
    }
  }
}

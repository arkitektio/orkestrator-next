fragment Entity on Entity {
  ...BaseNode
  id
  graph {
    id
  }
  category {
    id
    label
    ageName
    propertyDefinitions {
      ...PropertyDefinition
    }
  }
  label
  richProperties {
    key
    value
  }
  properties
  measuredBy {
    id
    label
    category {
      label
    }
    source {
      ... on Structure {
        identifier
        object
      }
    }
  }
  participatedIn {
    id
    role
    target {
      ...PathEventNode
    }
  }
  resultedOut {
    id
    role
    source {
      ...PathEventNode
    }
  }
}

# `Event` is a bare interface — only `kind` lives on it — so anything an event
# actually carries has to be read off the concrete types.
fragment PathEventNode on Event {
  ... on NaturalEvent {
    id
    label
    measuredFrom
    measuredTo
    category {
      label
    }
  }
  ... on ProtocolEvent {
    id
    label
    measuredFrom
    measuredTo
    category {
      label
    }
  }
}

fragment PathEntity on Entity {
  ...ListEntity
  category {
    label
    image {
      presignedUrl
    }
  }
  externalId
}

fragment ListEntity on Entity {
  id
  label
  category {
    id
    label
  }
}

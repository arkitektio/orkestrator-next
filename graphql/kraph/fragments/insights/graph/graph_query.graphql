

fragment BaseGraphQuery on GraphQuery {
  id
  label
  description
  graph {
    id
    name
  }
}

fragment ListGraphQuery on GraphQuery {
  id
  label
  description
  # A row saved as raw Cypher, before plans were the contract. It still renders,
  # but takes no filter, order or page — worth saying so where they are listed.
  legacy
  graph {
    id
    name
  }
  __typename
}

fragment GraphQuery on GraphQuery {
  ...BaseGraphQuery
  ...GraphTableQuery
}


fragment ListGraphTableQuery on GraphTableQuery {
  ...BaseGraphQuery
  __typename
}

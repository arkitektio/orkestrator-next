fragment ScatterPlot on ScatterPlot {
  id
  label
  description
  xColumn
  yColumn
  idColumn
  colorColumn
  sizeColumn
  shapeColumn
  # A scatter plot is over one graph table query. It used to be over a union of
  # three, two of which had no execution path anywhere.
  query {
    ...GraphTableQuery
  }
}

fragment ListScatterPlot on ScatterPlot {
  id
  label
  xColumn
  yColumn
}

fragment MatchPath on MatchPath {
  nodes
  relations
  relationDirections
  # Which category each position in `nodes` is constrained to. New with the plan
  # contract: the compiled Cypher used to bake the label into the string.
  nodeCategories
  title
  color
  optional
}
fragment ReturnStatement on ReturnStatement {
  path
  property
  node
  # The returned column's name. Render filters and orders address returned
  # aliases, which is why splicing a filter into raw Cypher could not work.
  alias
}

fragment WhereClause on WhereClause {
  path
  node
  property
  operator
  value
}

fragment Column on Column {
  key
  valueKind
  label
  kind
  description
  categoryKey
  searchable
  isIdForKey
  preferHidden
}


# The saved query itself. A table query used to be a Cypher string the client
# wrote and the server stored verbatim; the plan is the contract now, and each
# projection kind compiles it. `BuilderArgs` was the builder's private echo of
# the same three lists, written by one mutation and readable by no field — the
# plan replaces both.
fragment TableQueryPlan on TableQueryPlan {
  version
  matches {
    ...MatchPath
  }
  wheres {
    ...WhereClause
  }
  returns {
    ...ReturnStatement
  }
}

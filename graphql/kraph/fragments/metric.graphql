fragment Metric on Metric {
  id
  kind {
    id
    key
    label
    description
  }
  key
  value
  unit
}

fragment ListMetric on Metric {
  id
  value
  label
  key
  unit
  kind {
    id
    key
    label
  }
}

fragment PathMetric on Metric {
  ...ListMetric
  kind {
    id
    key
    label
  }
  value
}

# A measured value about a structure. Claim-grain: it has no `label` and no
# vertex — its name is its kind's key.

fragment ListMetric on Metric {
  id
  key
  value
  unit
  kind {
    id
    key
    label
  }
}

fragment Metric on Metric {
  ...ListMetric
  confidence
  confidenceType
  measuredAt
  assertedAt
  kind {
    id
    key
    label
    description
  }
}

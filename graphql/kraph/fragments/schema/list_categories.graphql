fragment BaseListCategory on Category {
  id
  term {
    ...ListTerm
  }
  description
  image {
    presignedUrl
  }
  key
  tags {
    id
    name
  }
  ageName

}

fragment BaseListNodeCategory on NodeCategory {
  id
  positionX
  positionY
  width
  height
}

fragment BaseListEdgeCategory on EdgeCategory {
  id
}

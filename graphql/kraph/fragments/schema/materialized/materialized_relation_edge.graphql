fragment ListMaterializedRelationEdge on MaterializedRelationEdge {
  id
  graph {
    id
    name
  }
  source {
    id
    label
  }
  target {
    id
    label
  }
  edge {
    id
    key
    label
    term {
      ...ListTerm
    }
  }
}


fragment MaterializedRelationEdge on MaterializedRelationEdge {
  id
  graph {
    id
    name
  }
  source {
    id
    label
  }
  target {
    id
    label
  }
}

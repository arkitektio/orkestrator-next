fragment EventRole on EventRole {
  key
  role
  descriptor {
    ...EntityDescriptor
  }
}


fragment EntityDescriptor on EntityDescriptor {
  keys
  ontologyTerms
  defaultCategoryKey
}

# A structure kind has no key, no tags and no ontology references — those
# descriptor fields are tombstones. `identifiers` is what actually selects one.
fragment StructureDescriptor on StructureDescriptor {
  defaultCategoryKey
}

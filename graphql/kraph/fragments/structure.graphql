fragment Structure on Structure {
  ...BaseNode
  id
  object
  identifier
  kindId
  kind {
    ...StructureKind
  }
  metrics {
    ...ListMetric
  }
}

fragment ListStructure on Structure {
  id
  label
  object
  identifier
  kindId
  kind {
    id
    identifier
    label
  }
}


fragment InformedStructure on Structure {
  ...BaseNode
  id
  object
  identifier
  kind {
    id
    identifier
  }
  graph {
    id
    name
  }
  metrics {
    ...ListMetric
  }
}

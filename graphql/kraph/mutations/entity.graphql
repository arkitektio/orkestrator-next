mutation CreateEntity($input: CreateEntityInput!) {
  createEntity(input: $input) {
    ...Entity
  }
}

mutation AttestEntity($id: String!) {
  attestEntity(input: { id: $id }) {
    ...Entity
  }
}

# Claims name the organization's word, not a category row: typing a word that
# has not been used before creates it.
mutation CreateEntityInline($term: String!) {
  result: createEntity(input: {
    term: $term
  }) {
    value: id
    label: label
  }
}


mutation ArchiveEntity($id: GraphID!) {
  archiveEntity(input: {id: $id}) {
    ...Entity
  }
}

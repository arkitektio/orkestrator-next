mutation AssertMeasurementExists($input: AssertMeasurementExistsInput!) {
  assertMeasurementExists(input: $input) {
    assertion {
      ...Assertion
    }
    measurement {
      ...Measurement
    }
  }
}

mutation RetractMeasurement($id: String!) {
  retractMeasurement(input: { id: $id }) {
    assertion {
      ...Assertion
    }
    measurement {
      ...Measurement
    }
  }
}

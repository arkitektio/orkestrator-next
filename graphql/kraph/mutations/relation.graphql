# NOTE: `createRelation` / `updateRelation` were removed from the kraph schema.
# Entity <-> entity relations are no longer created directly; they are derived
# from events (createNaturalEvent / createProtocolEvent role mappings). Only
# delete/archive remain on existing relations.

mutation DeleteRelation($id: GraphID!) {
  deleteRelation(input: { id: $id })
}

mutation ArchiveRelation($id: GraphID!) {
  archiveRelation(input: { id: $id }) {
    ...Relation
  }
}

mutation AssertStructureRelationExists($input: AssertStructureRelationExistsInput!) {
  assertStructureRelationExists(input: $input) {
    assertion {
      ...Assertion
    }
    structureRelation {
      ...StructureRelation
    }
  }
}

mutation RetractStructureRelation($id: String!) {
  retractStructureRelation(input: { id: $id }) {
    assertion {
      ...Assertion
    }
    structureRelation {
      ...StructureRelation
    }
  }
}

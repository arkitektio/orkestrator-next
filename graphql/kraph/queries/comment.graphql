# Comments are addressed by the external datum they are about — (identifier,
# object) — not by a graph. A remark is organization-scoped: it stands or it
# does not, and no view scopes it, so there is nothing to pick here.
query CommentsFor($identifier: String!, $object: ID!) {
  commentsFor(identifier: $identifier, object: $object) {
    ...ListComment
  }
}

query MyMentions {
  myMentions {
    ...MentionComment
  }
}

query DetailComment($id: ID!) {
  comment(id: $id) {
    ...DetailComment
  }
}

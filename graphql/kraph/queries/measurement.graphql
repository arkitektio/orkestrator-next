query GetMeasurement($id: ID!) {
  measurement(id: $id) {
    ...Measurement
  }
}

query SearchMeasurements($category: ID!, $values: [ID!]) {
  options: measurements(
    measurementCategoryId: $category
    filters: { ids: $values }
    pagination: { limit: 10 }
  ) {
    value: id
    label: label
  }
}



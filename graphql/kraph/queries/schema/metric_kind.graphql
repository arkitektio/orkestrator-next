query GetMetricKind($id: ID!) {
  metricKind(id: $id) {
    ...MetricKind
  }
}

query SearchMetricKinds($search: String, $values: [ID!]) {
  options: metricKinds(
    filters: { search: $search, ids: $values }
    pagination: { limit: 10 }
  ) {
    value: id
    label: key
  }
}

query ListMetricKinds(
  $filters: MetricKindFilter
  $pagination: VocabularyPaginationInput
) {
  metricKinds(filters: $filters, pagination: $pagination) {
    ...ListMetricKind
  }
}

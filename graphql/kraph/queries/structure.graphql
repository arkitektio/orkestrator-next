query GetStructure($id: GraphID!) {
  structure(id: $id) {
    ...Structure
  }
}

query SearchStructures($id: ID, $search: String, $values: [GraphID!]) {
  options: structures(
    structureKindId: $id
    filters: { search: $search, ids: $values }
    pagination: { limit: 10 }
  ) {
    value: id
    label: label
  }
}

query GetInformedStructure(
  $graph: ID!
  $identifier: StructureIdentifier!
  $object: StructureObject!
) {
  structureByIdentifier(
    graph: $graph
    identifier: $identifier
    object: $object
  ) {
    ...InformedStructure
  }
}

query ListStructures(
  $id: ID
  $filters: StructureFilter
  $pagination: StructurePaginationInput
  $ordering: [StructureOrder!]
) {
  structures(structureKindId: $id, filters: $filters, pagination: $pagination, ordering: $ordering) {
    ...ListStructure
  }
}

query InformingStructures($entityId: String!) {
  informingStructures(entityId: $entityId) {
    ...ListStructure
  }
}

query MetricsForStructure($structureId: GraphID!) {
  metricsForStructure(structureId: $structureId) {
    ...ListMetric
  }
}

query MetricsForAssertion($assertionId: GraphID!) {
  metricsForAssertion(assertionId: $assertionId) {
    ...ListMetric
  }
}

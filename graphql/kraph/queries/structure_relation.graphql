query GetStructureRelation($id: ID!) {
  structureRelation(id: $id) {
    ...DetailStructureRelation
  }
}

query SearchStructureRelations($category: ID!, $values: [ID!]) {
  options: structureRelations(
    structureRelationCategoryId: $category,
    filters: { ids: $values }
    pagination: { limit: 10 }
  ) {
    value: id
    label: label
  }
}



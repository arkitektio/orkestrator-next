fragment Folder on Folder {
  id
  name
  description
  provenanceEntries {
    ...ProvenanceEntry
  }
  files {
    ...ListFile
  }
  children {
    ...ListFolder
  }
  isDefault
  pinned
  createdAt
  creator {
    sub
  }
  tags
}

fragment ListFolder on Folder {
  id
  name
  description
  isDefault
}

fragment Table on Table {
  id
  name
  store {
    ...ParquetStore
  }
  columns {
    name
    type
    accessors {
      ...Accessor
      ...ImageAccessor
      ...LabelAccessor
    }
  }
  accessors {
    ...ImageAccessor
    ...LabelAccessor
  }
}

fragment ListTable on Table {
  id
  name
  store {
    ...ParquetStore
  }
}

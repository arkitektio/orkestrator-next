# Candidates for the Add Layer dialog, asked the way the model is actually
# shaped: a scene composes over a world coordinate system, and what can be added
# is everything living in a space with a traversable path into that world.
#
# `placedSystems` IS that set — "the same set the `placeableIn` filters answer
# from, so a picker and a layer mutation cannot disagree" — and asking it instead
# of one flat `placeableIn` list per source kind buys three things: mesh
# collections and annotation collections become visible (they have no
# placeability filter of their own), the answer comes pre-grouped by the space
# that makes each candidate reachable, and there is one round trip instead of
# one per kind.
#
# Directed, unlike `coordinateGraph`, which walks the undirected neighbourhood:
# this asks who can get IN.
query AddLayerReachable($scene: ID!) {
  scene(id: $scene) {
    id
    name
    worldCoordinateSystem {
      id
      name
      # The world's own residents. Whether `placedSystems` includes the world
      # itself is not stated, and data sitting IN the world is trivially
      # composable there — so it is asked for separately and deduped by space id.
      residents {
        ...AddLayerCandidate
      }
      placedSystems {
        id
        name
        residents {
          ...AddLayerCandidate
        }
      }
    }
  }
}

# Which lenses the server would actually accept as a drawable / label layer, as
# id-only capability sets.
#
# `asLayer` is a real narrowing rather than a no-op: IMAGE requires an x and a y
# axis of more than one pixel (the same gate layer creation applies), and LABEL
# additionally requires a primary derivation declaring CATEGORIZED. That second
# one is not derivable from anything the picker fetches, so it is asked rather
# than guessed — a kind button is disabled when the server would refuse it, not
# after it has.
query AddLayerLensCapabilities($space: ID!) {
  drawable: lenses(filters: { placeableIn: { space: $space, asLayer: IMAGE } }) {
    id
  }
  labels: lenses(filters: { placeableIn: { space: $space, asLayer: LABEL } }) {
    id
  }
}

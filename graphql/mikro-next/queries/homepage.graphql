query HomePage {
  adatasets: adatasets(pagination: { limit: 1 }, ordering: [{ createdAt: DESC }]) {
    ...ListADataset
  }

  files: files(pagination: { limit: 1 }, ordering: [{ createdAt: DESC }]) {
    ...ListFile
  }
}

query PeerHomePage($id: ID!) {
  adatasets: adatasets(
    pagination: { limit: 1 }
    filters: { owner: $id }
    ordering: [{ createdAt: DESC }]
  ) {
    ...ListADataset
  }

  files: files(
    pagination: { limit: 1 }
    filters: { owner: $id }
    ordering: [{ createdAt: DESC }]
  ) {
    ...ListFile
  }
}


# Still the legacy `imagesStats` — it is the only aggregate the schema exposes
# (there is no `adatasetsStats`), so the statistics sidebars keep this one
# Image-shaped dependency until the backend offers a replacement.
query HomePageStats{
  imagesStats(filters: {
    owner: null
  }) {
    count
    series(by: DAY, field: PK, timestampField: CREATED_AT) {
      count
    }
  }
}

query PeerHomePageStats($id: ID!){
  imagesStats(filters: {
    owner: $id
  }) {
    count
    series(by: DAY, field: PK, timestampField: CREATED_AT) {
      count
    }
  }
}

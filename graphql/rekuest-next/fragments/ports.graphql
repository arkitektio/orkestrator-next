fragment StringAssignWidget on StringAssignWidget {
  __typename
  kind
  placeholder
  asParagraph
}

fragment SliderAssignWidget on SliderAssignWidget {
  __typename
  kind
  min
  max
  step
}

fragment StateChoiceAssignWidget on StateChoiceAssignWidget {
  __typename
  kind
  followValue
  statePath
  stateCall {
    ...PortCall
  }
  stateAccessors {
    optionKey
    path
    call {
      ...PortCall
    }
  }
  dependency
  dependencies
}

fragment ProxyWidget on ProxyWidget {
  __typename
  kind
  targetPort
  targetAction
  targetDependency
}

fragment FilterPort on ArgPort {
  __typename
  kind
  key
  identifier
  widget {
    ... on SearchAssignWidget {
      query
    }
  }
  description
  nullable
}

fragment SearchAssignWidget on SearchAssignWidget {
  __typename
  kind
  query
  ward
  filters {
    ...FilterPort
  }
  dependencies
}

# Custom widgets name a component from the UI catalog (`component`) and bind
# its props like a blok node. `fallback` is the widget to use when the catalog
# does not know the component; it cannot recurse into another custom widget,
# so it is selected as the non-custom variants only.
fragment CustomAssignWidget on CustomAssignWidget {
  __typename
  kind
  followValue
  component
  props {
    ...BlokComponentProp
  }
  dependencies
  fallback {
    __typename
    kind
    ...StringAssignWidget
    ...SearchAssignWidget
    ...SliderAssignWidget
    ...ChoiceAssignWidget
    ...ProxyWidget
    ...StateChoiceAssignWidget
  }
}

# Choices live on the port (`ArgPort.choices` / `ReturnPort.choices`); the
# widget only says how to present them.
fragment ChoiceAssignWidget on ChoiceAssignWidget {
  __typename
  kind
  followValue
  placeholder
}

fragment ArgChildPortNested on ArgPort {
  __typename
  kind
  key
  identifier
  referenceUnit
  proposedUnits
  dimension
  children {
    kind
    identifier
    widget {
      ...AssignWidget
    }
  }
  choices {
    value
    label
    description
  }
  widget {
    ...AssignWidget
  }
  description
  nullable
}

fragment ArgChildPort on ArgPort {
  __typename
  kind
  key
  identifier
  referenceUnit
  proposedUnits
  dimension
  children {
    ...ArgChildPortNested
  }
  widget {
    ...AssignWidget
  }
  choices {
    value
    label
    description
  }
  nullable
  description
}

fragment ReturnChildPortNested on ReturnPort {
  __typename
  kind
  key
  identifier
  referenceUnit
  proposedUnits
  dimension
  children {
    kind
    identifier
    widget {
      ...ReturnWidget
    }
  }
  choices {
    value
    label
    description
  }
  widget {
    ...ReturnWidget
  }
  description
  nullable
}


fragment ReturnChildPort on ReturnPort {
  __typename
  kind
  key
  identifier
  referenceUnit
  proposedUnits
  dimension
  children {
    ...ReturnChildPortNested
  }
  widget {
    ...ReturnWidget
  }
  choices {
    value
    label
    description
  }
  nullable
  description
}

fragment BaseEffect on Effect {
  __typename
  kind
  dependencies
  source
  call {
    ...PortCall
  }
}

fragment CustomEffect on CustomEffect {
  ...BaseEffect
  __typename
  kind
}

fragment MessageEffect on MessageEffect {
  ...BaseEffect
  __typename
  kind
  message
}

fragment HideEffect on HideEffect {
  ...BaseEffect
  __typename
  fade
}

fragment PortEffect on Effect {
  ...CustomEffect
  ...MessageEffect
  ...HideEffect
}

fragment AssignWidget on AssignWidget {
  __typename
  kind
  ...StringAssignWidget
  ...SearchAssignWidget
  ...SliderAssignWidget
  ...ChoiceAssignWidget
  ...ProxyWidget
  ...CustomAssignWidget
  ...StateChoiceAssignWidget
}

fragment Validator on Validator {
  call {
    ...PortCall
  }
  dependencies
  label
  errorMessage
  source
}

fragment ArgPort on ArgPort {
  __typename
  key
  label
  nullable
  description
  effects {
    ...PortEffect
  }
  widget {
    ...AssignWidget
  }
  kind
  identifier
  referenceUnit
  proposedUnits
  dimension
  children {
    ...ArgChildPort
  }
  choices {
    value
    label
    description
  }
  default
  nullable
  validators {
    ...Validator
  }
  requires {
    key
    operator
    value
  }
}

fragment ReturnPort on ReturnPort {
  __typename
  key
  label
  nullable
  description
  effects {
    ...PortEffect
  }
  widget {
    ...ReturnWidget
  }
  kind
  identifier
  referenceUnit
  proposedUnits
  dimension
  children {
    ...ReturnChildPort
  }
  choices {
    value
    label
    description
  }
  default
  nullable
  provides {
    key
    operator
    value
  }
}


fragment CustomReturnWidget on CustomReturnWidget {
  __typename
  kind
  component
  props {
    ...BlokComponentProp
  }
}

fragment ChoiceReturnWidget on ChoiceReturnWidget {
  __typename
  kind
}

fragment ReturnWidget on ReturnWidget {
  __typename
  kind
  ...CustomReturnWidget
  ...ChoiceReturnWidget
}

fragment PortGroup on PortGroup {
  key
  title
  description
  effects {
    ...PortEffect
  }
  ports
}

fragment Ports on Action {
  args {
    ...ArgPort
  }
  returns {
    ...ReturnPort
  }
  portGroups {
    ...PortGroup
  }
}

# --- Port calls -------------------------------------------------------------
# `call` is a blok UtilCall. GraphQL fragments cannot recurse, so nesting is
# selected to a fixed depth: a top-level call, whose arguments may hold one
# nested call, whose arguments may hold one more (leaf) call. Deeper payloads
# are rejected by the client's parser rather than silently truncated.

fragment PortCallLeafArgument on ActionArgument {
  key
  valueLiteral
  valuePath
}

fragment PortCallLeaf on UtilCall {
  operation
  arguments {
    ...PortCallLeafArgument
  }
}

fragment PortCallInnerArgument on ActionArgument {
  ...PortCallLeafArgument
  utilCall {
    ...PortCallLeaf
  }
  valueList {
    ...PortCallLeafArgument
  }
  valueDict {
    ...PortCallLeafArgument
  }
}

fragment PortCallInner on UtilCall {
  operation
  arguments {
    ...PortCallInnerArgument
  }
}

fragment PortCallArgument on ActionArgument {
  ...PortCallLeafArgument
  utilCall {
    ...PortCallInner
  }
  valueList {
    ...PortCallInnerArgument
  }
  valueDict {
    ...PortCallInnerArgument
  }
}

fragment PortCall on UtilCall {
  operation
  arguments {
    ...PortCallArgument
  }
}

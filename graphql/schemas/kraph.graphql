  updateStructure(input: UpdateStructureInput!): AssertedStructure!

  """Update a structure kind's label, description or colour"""
  updateStructureKind(input: UpdateStructureKindInput!): StructureKind!

  """Replace a structure relation, keeping the old assertion on the record"""

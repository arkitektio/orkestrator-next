  """
  supersedeMetricValue(input: SupersedeMetricValueInput!): AssertedMetric!

  """Update an existing entity category in the graph"""
  updateEntityCategory(input: UpdateEntityCategoryInput!): EntityCategory!

  """Update an existing graph in the graph engine"""
  updateGraph(input: UpdateGraphInput!): Graph!

  """Update a graph table query"""
  updateGraphTableQuery(input: UpdateGraphTableQueryInput!): GraphTableQuery!

  """Update the visual configuration of a graph in the graph engine"""
  updateGraphVisual(input: UpdateGraphVisualInput!): Graph!

  """Update an existing measurement category in the graph"""
  updateMeasurementCategory(input: UpdateMeasurementCategoryInput!): MeasurementCategory!

  """Update a metric kind's label, description or colour"""
  updateMetricKind(input: UpdateMetricKindInput!): MetricKind!

  """Update an existing natural event category in the graph"""
  updateNaturalEventCategory(input: UpdateNaturalEventCategoryInput!): NaturalEventCategory!

  """Update an existing protocol event category in the graph"""
  updateProtocolEventCategory(input: UpdateProtocolEventCategoryInput!): ProtocolEventCategory!

  """
  Replace a relation with a new assertion, retracting the old one. Two assertions are recorded; the result reports the one that made the relation now standing
  """
  updateRelation(input: UpdateRelationInput!): AssertedRelation!

  """Update an existing relation category in the graph"""
  updateRelationCategory(input: UpdateRelationCategoryInput!): RelationCategory!

  """Update a scatter plot"""
  updateScatterPlot(input: UpdateScatterPlotInput!): ScatterPlot!

  """

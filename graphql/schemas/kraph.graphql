  """
  createTerm(input: CreateTermInput!): Term!

  """Delete an entity category from the graph"""
  deleteEntityCategory(input: DeleteEntityCategoryInput!): ID!

  """Delete a graph from the graph engine"""
  deleteGraph(input: DeleteGraphInput!): ID!

  """Delete a graph table query"""
  deleteGraphTableQuery(input: DeleteGraphTableQueryInput!): ID!

  """Delete a measurement category from the graph"""
  deleteMeasurementCategory(input: DeleteMeasurementCategoryInput!): ID!

  """Retire a metric kind and the measurements recorded under it"""
  deleteMetricKind(input: DeleteMetricKindInput!): ID!

  """Delete a natural event category from the graph"""
  deleteNaturalEventCategory(input: DeleteNaturalEventCategoryInput!): ID!

  """Delete a protocol event category from the graph"""
  deleteProtocolEventCategory(input: DeleteProtocolEventCategoryInput!): ID!

  """Delete a relation category from the graph"""
  deleteRelationCategory(input: DeleteRelationCategoryInput!): ID!

  """Delete a scatter plot"""
  deleteScatterPlot(input: DeleteScatterPlotInput!): ID!

  """Retire a structure kind and the evidence recorded under it"""
  deleteStructureKind(input: DeleteStructureKindInput!): ID!

  """Delete a structure relation category from the graph"""
  deleteStructureRelationCategory(input: DeleteStructureRelationCategoryInput!): ID!

  """Retire a word nothing has been claimed under"""
  deleteTerm(input: DeleteTermInput!): ID!

  """
  Get the structure for an external datum, creating it if this is the first sight of it
  """
  ensureStructure(input: EnsureStructureInput!): AssertedStructure!

  """Finalize a big file upload after the client has written the object"""
  finishBigFileUpload(input: FinishBigFileUploadInput!): BigFileStore!

  """Finalize a media upload after the client has written the object"""
  finishMediaUpload(input: FinishMediaUploadInput!): MediaStore!

  """Finalize a Zarr upload after the client has written the object"""
  finishZarrUpload(input: FinishZarrUploadInput!): ZarrStore!

  """Assert that a structure is evidence for an entity"""
  linkStructureToEntity(input: LinkStructureInput!): AssertedDescription!

  """Request an upload grant for a big file store"""
  requestBigFileUpload(input: RequestBigFileUploadInput!): BigFileUploadGrant!

  """Upload media and return a URL for access"""
  requestMediaUpload(input: RequestMediaUploadInput!): MediaUploadGrant!

  """Request an upload grant for a Zarr store"""
  requestZarrUpload(input: RequestZarrUploadInput!): ZarrUploadGrant!

  """
  Claim a remark no longer stands — resolved by a reviewer or withdrawn by its author; the assertion records whose position it is. The row survives
  """
  retractComment(input: RetractCommentInput!): AssertedComment!

  """
  Claim that an entity no longer stands. It leaves every projection that counts the claim; the evidence stays.
  """
  retractEntity(input: RetractEntityInput!): AssertedEntity!

  """
  Retract several link claims as one act, by their `Link` ids — a relation, a classification, a participation, a measurement
  """
  retractLinks(input: RetractLinksInput!): AssertedLinks!

  """Retract a measurement assertion without destroying it"""
  retractMeasurement(input: RetractMeasurementInput!): AssertedMeasurement!

  """
